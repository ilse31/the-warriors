[package]
name = "warriors-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
rfd = "=0.15.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"

