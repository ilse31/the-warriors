name: Windows build and experimental release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Format, lint, and test
        shell: pwsh
        run: |
          cargo +1.92.0 fmt --manifest-path launcher/Cargo.toml --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.92.0 clippy --locked --manifest-path launcher/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.92.0 test --locked --manifest-path launcher/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build launcher
        run: cargo +1.92.0 build --locked --manifest-path launcher/Cargo.toml --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-launcher
          path: launcher/target/x86_64-pc-windows-msvc/release/warriors-launcher.exe
          if-no-files-found: error
          retention-days: 7

  runtime:
    needs: launcher
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      configured: ${{ steps.input.outputs.configured }}
    steps:
      - name: Check private build input
        id: input
        shell: pwsh
        env:
          PRIVATE_GAME_ELF_URL: ${{ secrets.PRIVATE_GAME_ELF_URL }}
        run: |
          if ($env:PRIVATE_GAME_ELF_URL) {
            'configured=true' >> $env:GITHUB_OUTPUT
          } else {
            'configured=false' >> $env:GITHUB_OUTPUT
            'Runtime build skipped: configure PRIVATE_GAME_ELF_URL to enable automated game builds.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.input.outputs.configured == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.input.outputs.configured == 'true'
        with:
          name: windows-launcher
          path: build/launcher
      - name: Build runtime using verified private input
        if: steps.input.outputs.configured == 'true'
        shell: pwsh
        env:
          PRIVATE_GAME_ELF_URL: ${{ secrets.PRIVATE_GAME_ELF_URL }}
        run: ./scripts/Build-WindowsRuntime.ps1
      - name: Package without ISO or game assets
        if: steps.input.outputs.configured == 'true'
        shell: pwsh
        run: ./scripts/Package-Windows.ps1 -LauncherExe build/launcher/warriors-launcher.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.input.outputs.configured == 'true'
        with:
          name: windows-experimental-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: runtime
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.runtime.outputs.configured == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-experimental-package
          path: dist
      - name: Publish experimental prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content launcher/Cargo.toml -Raw | Select-String '(?m)^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag harus sama dengan versi Cargo.toml.' }
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --prerelease --title "The Warriors $version — experimental" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
